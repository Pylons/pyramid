name: Build and test

on:
    # Only on pushes to main or one of the release branches we build on push
    push:
        branches:
            - main
            - "[0-9].[0-9]+-branch"
        tags:
            - "*"
    # Build pull requests
    pull_request:

# Drop all GITHUB_TOKEN permissions so ci-tests cannot modify the repo.
# Checkout still works because the repo is public.
permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            # See https://github.com/actions/runner-images
            matrix:
                py:
                    - "3.11"
                    - "3.12"
                    - "3.13"
                    - "3.14"
                    - "3.15"
                    - "pypy-3.12"
                os:
                    - "ubuntu-24.04" # x64
                    - "windows-2025" # x64
                    - "macos-15" # arm64
                    - "macos-15-intel" # x64

        name: "Python: ${{ matrix.py }} on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: ${{ matrix.py }}
            - name: Running tox for current python version
              run: uvx --with tox-uv tox -e py

    test-pkg-resources:
        runs-on: ubuntu-24.04
        name: "Python: 3.14 on ubuntu-24.04 with pkg_resources"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: "3.14"
            - run: uvx tox -e py314-pkgresources

    coverage:
        runs-on: ubuntu-24.04
        name: Validate coverage
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: "3.14"
            - run: uvx --with tox-uv tox -e py314-cover,coverage
    docs:
        runs-on: ubuntu-24.04
        name: Build the documentation
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: "3.14"
            - run: uvx --with tox-uv tox -e docs
    lint:
        runs-on: ubuntu-24.04
        name: Lint the package
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup uv
              uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
              with:
                  python-version: "3.14"
            - run: uvx --with tox-uv tox -e lint
