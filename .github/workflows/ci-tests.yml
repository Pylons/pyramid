name: Build and test

on:
    # Only on pushes to main or one of the release branches we build on push
    push:
        branches:
            - main
            - "[0-9].[0-9]+-branch"
        tags:
            - "*"
    # Build pull requests
    pull_request:

jobs:
    test:
        strategy:
            # See https://github.com/actions/runner-images
            matrix:
                py:
                    - "3.8"
                    - "3.9"
                    - "3.10"
                    - "3.11"
                    - "pypy-3.8"
                os:
                    - "ubuntu-24.04" # x64
                    - "windows-2022" # x64
                    - "macos-15" # arm64
                    - "macos-15-intel" # x64
                exclude:
                    # PyPy3 on Windows doesn't seem to work
                    - os: "windows-2022"
                      py: "pypy-3.8"

        name: "Python: ${{ matrix.py }} on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.py }}
            - name: Running tox for current python version
              run: uvx --with tox-uv tox -e py

    # uv does not provide CPython 3.6 or 3.7 and the hosted runner images no
    # longer ship them, so test those versions in the official docker images.
    test-legacy:
        strategy:
            matrix:
                py:
                    - "3.6"
                    - "3.7"

        name: "Python: ${{ matrix.py }} on python:${{ matrix.py }} container"
        runs-on: ubuntu-24.04
        container: python:${{ matrix.py }}
        steps:
            - uses: actions/checkout@v6
            - run: pip install tox
            - name: Running tox for current python version
              run: tox -e py

    coverage:
        runs-on: ubuntu-24.04
        name: Validate coverage
        steps:
            - uses: actions/checkout@v6
            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.8"
            - run: uvx --with tox-uv tox -e py38-cover,coverage
    docs:
        runs-on: ubuntu-24.04
        name: Build the documentation
        steps:
            - uses: actions/checkout@v6
            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.8"
            - run: uvx --with tox-uv tox -e docs
    lint:
        runs-on: ubuntu-24.04
        name: Lint the package
        steps:
            - uses: actions/checkout@v6
            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: "3.8"
            - run: uvx --with tox-uv tox -e lint
